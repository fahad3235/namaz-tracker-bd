<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namaz Tracker BD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div>
    <h1 id="appTitle"></h1>
    <p id="appTagline"></p>
  </div>
  <button id="langBtn" type="button" aria-label="language"></button>
</header>

<nav class="tabs" role="tablist">
  <button type="button" data-tab="today" role="tab" aria-selected="true"></button>
  <button type="button" data-tab="dashboard" role="tab" aria-selected="false"></button>
  <button type="button" data-tab="history" role="tab" aria-selected="false"></button>
  <button type="button" data-tab="data" role="tab" aria-selected="false"></button>
</nav>

<main>
  <section id="tab-today" role="tabpanel">
    <div class="card">
      <h2 id="todayHeading"></h2>
      <div id="progressText" aria-live="polite"></div>
      <div class="pbar" aria-hidden="true"><div id="progressFill"></div></div>
    </div>
    <div id="prayerCards"></div>
    <div class="card">
      <h3 id="qadaTitle"></h3>
      <p id="qadaExplainer" class="muted"></p>
      <div id="qadaRows"></div>
      <p id="qadaEmpty" class="muted" hidden></p>
      <div id="qadaTotal"></div>
    </div>
  </section>

  <section id="tab-dashboard" role="tabpanel" hidden>
    <div class="card">
      <div id="dashHeroSub"></div>
      <div id="dashHero"></div>
    </div>
    <div class="card">
      <h3 id="dashStreakTitle"></h3>
      <div id="streakVal"></div>
      <p id="streakRule" class="muted"></p>
    </div>
    <div class="card">
      <h3 id="dashConsistencyTitle"></h3>
      <div id="consistRows"></div>
    </div>
    <div class="card">
      <h3 id="dashWeeklyTitle"></h3>
      <div id="weekGrid"></div>
    </div>
    <div class="card">
      <h3 id="dashTrendTitle"></h3>
      <svg id="trendSvg" role="img" aria-label="30-day trend"></svg>
    </div>
  </section>

  <section id="tab-history" role="tabpanel" hidden>
    <div class="card">
      <h3 id="histTitle"></h3>
      <div class="jump">
        <label id="jumpLabel" for="jumpDate"></label>
        <input type="date" id="jumpDate" max="9999-12-31">
        <button type="button" id="jumpBtn" class="btn ghost"></button>
      </div>
      <p id="jumpErr" class="msg err" hidden></p>
    </div>
    <div id="editor" hidden>
      <h3 id="edTitle"></h3>
      <div id="edToggles"></div>
      <div id="edLegend"></div>
      <div class="erow">
        <button type="button" id="edDelete" class="btn danger"></button>
        <button type="button" id="edClose" class="btn ghost"></button>
      </div>
    </div>
    <p id="histEmpty" class="muted" hidden></p>
    <div id="histList"></div>
  </section>

  <section id="tab-data" role="tabpanel" hidden>
    <div class="card">
      <p id="dataExplainer" class="muted"></p>
      <div class="field">
        <button type="button" id="expBtn" class="btn"></button>
      </div>
      <div class="field">
        <label for="impText" id="impLabel"></label>
        <textarea id="impText" spellcheck="false"></textarea>
      </div>
      <button type="button" id="impBtn" class="btn ghost"></button>
      <p id="dataMsg" class="msg" hidden></p>
    </div>
    <div class="card">
      <h3 id="clearTitle"></h3>
      <p id="clearHelp" class="muted"></p>
      <div class="field">
        <input type="text" id="clearInput" autocomplete="off" placeholder="DELETE">
      </div>
      <button type="button" id="clearBtn" class="btn danger" disabled></button>
    </div>
  </section>
</main>

<div id="toast" hidden></div>

<footer>
  <p id="disclaimer"></p>
  <p>Namaz Tracker BD - offline, no accounts, no tracking.</p>
</footer>

<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
